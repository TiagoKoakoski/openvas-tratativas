[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvas-tratativas"
version = "0.1.0"
description = "Transforma relatórios do OpenVAS/Greenbone em plano de correção, com histórico entre rodadas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tiago Koakoski" }]
dependencies = ["defusedxml>=0.7.1", "jinja2>=3.1.6", "tzdata>=2025.1"]

[project.scripts]
tratativas = "tratativas.cli:main"

[project.urls]
Repository = "https://github.com/TiagoKoakoski/openvas-tratativas"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/tratativas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"exemplo/*" = ["S", "E501"]
